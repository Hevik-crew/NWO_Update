# Группы для массового управления сложностью
groups:
  Elite Monsters:
    - Fuling Berserker
    - StoneGolem
    - Troll
    - Fenring
    - Lox
  True Bosses:
    - Eikthyr
    - TheElder
    - Bonemass
    - Moder
    - Yagluth
    - Queen

# НАСТРОЙКИ БИОМОВ (Сложность 4/5)

Meadows:
  stars:
    0: [15, 5, 1]           # До 3 звезд в начале
    1: [20, 10, 3, 1]       # После 1-го босса
    3: [30, 15, 8, 3, 1]    # На поздней игре
  infusion:
    0: { Poison: 5, Fire: 5, other: 5 }

Black Forest:
  stars:
    0: [20, 8, 2]
    1: [25, 12, 5, 2]
    2: [30, 18, 10, 5, 2]
  effect:
    Aggressive: 25
    Regenerating: 15

Swamp:
  stars:
    0: [25, 10, 5, 1]
    2: [30, 15, 10, 5, 2]
  infusion:
    0:
      Poison: [15, 25, 35, 45, 55]
  effect:
    Splitting: 10

Mountain:
  stars:
    0: [30, 15, 8, 3, 1]
  damage: 1.2
  effect:
    Quick: 20

Plains:
  stars:
    0: [35, 20, 10, 5, 2]
  effect:
    Armored: 20

# НАСТРОЙКИ БОССОВ (Исправленная версия)
True Bosses:
  health: 1.6
  damage: 1.3
  affix:
    0: 
      Reflective: 15
      Shielded: 25
      Mending: 20
      Summoner: 0        # Явно выключаем, чтобы сумма была <= 100
      Elementalist: 0    # Явно выключаем
      Enraged: 0         # Явно выключаем
      Twin: 0            # Явно выключаем
      other: 0           # Запрещаем любые другие случайные аффиксы

# ЭЛИТНЫЕ МОНСТРЫ (Визуальный страх и награда)
Elite Monsters:
  size: 0.15                # Ощутимо растут в размерах
  loot: [1, 2, 3, 4, 5, 6]  # Огромный дроп за 5 звезд
  damage per star: 0.25     # +25% урона за каждую звезду

# СПЕЦИФИКАЦИЯ СУЩЕСТВ
Deathsquito:
  movement speed: 1.15      # Смертожалы — ракеты
  health: 0.7               # Но убиваются с одного удара

Serpent:
  stars:
    0: [40, 15, 5]          # В море всегда будет опасно
  damage: 1.25

Wolf:
  tamed:
    health: 1.5             # Твои прирученные волки тоже стали сильнее
    damage: 1.3